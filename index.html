<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #74045F; --deep: #4A0340; --gold: #C5A15A; --gold-soft: #F3E7CC;
    --paper: #FFFFFF; --wash: #F8F3F7; --ink: #2A1A27; --muted: #7A6675; --line: #E7DCE4;
    --ok: #1F7A4D; --ok-soft: #E3F2EA; --warn: #B4531A; --warn-soft: #FBEADF; --bad: #B42318; --bad-soft: #FDE8E6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wash); color: var(--ink); font-family: 'Sarabun', system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  header { background: var(--purple); color: #fff; padding: 16px 16px 0; position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header .who { font-size: 14px; opacity: .9; margin-top: 2px; }
  header .who b { color: var(--gold-soft); font-weight: 500; }
  .tabs { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; border: 0; background: transparent; color: #fff; opacity: .75; font: inherit; font-size: 15px;
    padding: 8px 12px; border-bottom: 3px solid transparent; cursor: pointer; }
  .tabs button.on { opacity: 1; border-bottom-color: var(--gold); font-weight: 700; }
  main { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
  .sum { display: flex; gap: 8px; margin: 4px 0 12px; flex-wrap: wrap; }
  .pill { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; color: var(--muted); }
  .pill b { color: var(--ink); }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card.over { border-left: 4px solid var(--bad); }
  .card.done { opacity: .7; }
  .subj { font-weight: 700; font-size: 16px; margin: 0 0 4px; word-break: break-word; }
  .meta { font-size: 14px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 13px; border-radius: 6px; padding: 1px 8px; background: var(--gold-soft); color: var(--deep); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 15px; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; min-height: 40px; }
  .btn.pri { background: var(--purple); border-color: var(--purple); color: #fff; }
  .btn.okb { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn:disabled { opacity: .5; }
  a.file { color: var(--purple); font-size: 14px; }
  .post { margin-top: 10px; padding: 10px; background: var(--wash); border-radius: 8px; display: none; }
  .post.show { display: block; }
  .post label { display: block; font-size: 14px; color: var(--muted); margin: 6px 0 2px; }
  .post input, .post textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fff; }
  .note { font-size: 14px; color: var(--warn); margin-top: 6px; white-space: pre-wrap; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 18px 0 8px; }
  .empty, .msg { text-align: center; color: var(--muted); padding: 40px 16px; }
  .msg h3 { color: var(--ink); margin: 0 0 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 15px; display: none; z-index: 9; max-width: 90%; }
</style>
</head>
<body>
<header>
  <h1>📋 งานของฉัน</h1>
  <div class="who" id="who">กำลังตรวจสอบตัวตน…</div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="msg">กำลังโหลด…</div></main>
<div class="toast" id="toast"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== ตั้งค่า (แก้ 2 บรรทัดนี้) =====
const LIFF_ID = '2012534345-pgSOycKc';                                  // จาก LINE Developers → LINE Login channel → LIFF
const API_URL = 'https://script.google.com/macros/s/AKfycbw7hdsj-PS20H5UFOBvVz1ycRWB7a4FAYiFs4eW9Jz4txapLLrQxauq8rgoRXgj-Mxpfw/exec'; // URL เดียวกับ Webhook ของบอท (ไม่ต้องมี ?k=)

const SCOPE_NAME = { mine: 'งานของฉัน', unit: 'หน่วยงาน', all: 'ทั้งหมด' };
const ERR = {
  unregistered: ['ยังไม่ได้ลงทะเบียน', 'กลับไปที่แชทแล้วพิมพ์\nลงทะเบียน ชื่อ-สกุล | ตำแหน่ง | หน่วยงาน\nรอผู้ดูแลอนุมัติ แล้วเปิดหน้านี้อีกครั้ง'],
  pending: ['รอผู้ดูแลอนุมัติ', 'คำขอลงทะเบียนของคุณยังรออนุมัติ เมื่ออนุมัติแล้วบอทจะแจ้งในแชท'],
  blocked: ['บัญชีนี้ใช้งานไม่ได้', 'กรุณาติดต่อผู้ดูแล'],
  bad_token: ['ยืนยันตัวตนไม่สำเร็จ', 'ปิดหน้านี้แล้วเปิดใหม่จากแชท'],
  no_token: ['ยืนยันตัวตนไม่สำเร็จ', 'ปิดหน้านี้แล้วเปิดใหม่จากแชท'],
  not_configured: ['ระบบยังตั้งค่าไม่ครบ', 'ผู้ดูแลต้องตั้ง LIFF_CHANNEL_ID ใน Script properties'],
  forbidden: ['ไม่มีสิทธิ์', 'คุณไม่มีสิทธิ์ทำรายการนี้'],
  not_found: ['ไม่พบเรื่อง', 'เรื่องนี้อาจถูกลบหรือย้าย ลองดึงหน้าใหม่'],
  already_done: ['งานนี้เสร็จแล้ว', ''], bad_date: ['วันที่ไม่ถูกต้อง', 'เลือกวันที่วันนี้หรือหลังจากนี้'],
  need_reason: ['ต้องใส่เหตุผล', 'ใส่เหตุผลที่ขอเลื่อน'], busy: ['ระบบไม่ว่าง', 'ลองใหม่อีกครั้ง'], server: ['เกิดข้อผิดพลาด', 'ลองใหม่อีกครั้ง']
};
let state = { me: null, scope: 'mine', tab: 'tasks', tasks: [], subs: [] };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 2600); }

async function api(body) {
  const tk = liff.getIDToken();
  if (!tk) throw { err: 'no_token' };
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ idToken: tk }, body)) });
  const j = await res.json();
  if (!j.ok) throw j;
  return j;
}
function showErr(e) {
  const m = ERR[e && e.err] || ERR.server;
  $('main').innerHTML = '<div class="msg"><h3>' + esc(m[0]) + '</h3><div style="white-space:pre-wrap">' + esc(m[1]) + '</div>' +
    (liff.isInClient() ? '<p><button class="btn pri" onclick="liff.closeWindow()">กลับไปที่แชท</button></p>' : '') + '</div>';
  if (e && /^(unregistered|pending|blocked|bad_token|no_token|not_configured)$/.test(e.err)) { $('who').textContent = ''; $('tabs').innerHTML = ''; }
}

async function load() {
  try {
    const j = await api({ api: 'tasks', scope: state.scope });
    state.me = j.me; state.tasks = j.tasks || []; state.subs = j.subs || [];
    $('who').innerHTML = esc(j.me.name) + (j.me.unit ? ' · ' + esc(j.me.unit) : '') + ' · <b>' + esc(j.me.role) + '</b>';
    renderTabs(); render();
  } catch (e) { showErr(e); }
}
function renderTabs() {
  const t = [];
  state.me.scopes.forEach(s => t.push('<button data-k="tasks:' + s + '"' + (state.tab === 'tasks' && state.scope === s ? ' class="on"' : '') + '>' + SCOPE_NAME[s] + '</button>'));
  t.push('<button data-k="subs"' + (state.tab === 'subs' ? ' class="on"' : '') + '>เรื่องเสนอลงนาม</button>');
  $('tabs').innerHTML = t.join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'subs') { state.tab = 'subs'; renderTabs(); render(); return; }
    state.tab = 'tasks'; const sc = k.split(':')[1];
    if (sc !== state.scope) { state.scope = sc; $('main').innerHTML = '<div class="msg">กำลังโหลด…</div>'; renderTabs(); load(); } else { renderTabs(); render(); }
  });
}
function dueChip(t) {
  if (t.st === 'เสร็จ') return '<span class="chip ok">✅ เสร็จ</span>';
  if (t.days === null) return t.due && t.due !== '-' ? '<span class="chip">กำหนด ' + esc(t.due) + '</span>' : '';
  if (t.days < 0) return '<span class="chip bad">เลยกำหนด ' + (-t.days) + ' วัน</span>';
  if (t.days === 0) return '<span class="chip warn">ครบกำหนดวันนี้</span>';
  if (t.days <= 3) return '<span class="chip warn">อีก ' + t.days + ' วัน (' + esc(t.due) + ')</span>';
  return '<span class="chip">กำหนด ' + esc(t.due) + '</span>';
}
function stChip(t) {
  if (t.st === 'เสร็จ') return '';
  if (t.st === 'ขอเลื่อน') return '<span class="chip warn">⏳ ขอเลื่อนเป็น ' + esc(t.postTo) + '</span>';
  if (t.st === 'รับทราบแล้ว') return '<span class="chip ok">👌 รับทราบแล้ว</span>';
  return '<span class="chip">🆕 มอบแล้ว</span>';
}
function taskCard(t) {
  const over = t.st !== 'เสร็จ' && t.days !== null && t.days < 0;
  let h = '<div class="card' + (over ? ' over' : '') + (t.st === 'เสร็จ' ? ' done' : '') + '" data-key="' + esc(t.key) + '">' +
    '<p class="subj">' + esc(t.subj) + '</p>' +
    '<div class="meta">' + (t.from ? 'จาก ' + esc(t.from) : '') + (t.docNo && t.docNo !== '-' ? ' · ' + esc(t.docNo) : '') +
    (state.scope !== 'mine' ? '<br>ผู้รับผิดชอบ: ' + esc(t.who) : '') + '</div>' +
    '<div class="row">' + stChip(t) + dueChip(t) + (t.url ? '<a class="file" href="' + esc(t.url) + '" target="_blank" rel="noopener">📄 เปิดไฟล์</a>' : '') + '</div>';
  if (t.mine && t.postWhy && t.st === 'ขอเลื่อน') h += '<div class="note">เหตุผล: ' + esc(t.postWhy) + '</div>';
  if (t.mine && t.st !== 'เสร็จ') {
    h += '<div class="acts">' +
      (t.st === 'มอบแล้ว' ? '<button class="btn pri" data-act="ack">👌 รับทราบ</button>' : '') +
      '<button class="btn okb" data-act="done">✅ เสร็จ</button>' +
      '<button class="btn" data-act="post">⏳ ขอเลื่อน</button></div>' +
      '<div class="post"><label>ขอเลื่อนเป็นวันที่</label><input type="date" class="pdate" min="' + todayIso() + '">' +
      '<label>เหตุผล</label><textarea class="pwhy" rows="2" maxlength="300"></textarea>' +
      '<div class="acts"><button class="btn pri" data-act="postpone">ส่งคำขอเลื่อน</button><button class="btn" data-act="cancel">ยกเลิก</button></div></div>';
  }
  return h + '</div>';
}
function todayIso() { const d = new Date(Date.now() + 7 * 3600000); return d.toISOString().slice(0, 10); }
function render() {
  if (state.tab === 'subs') return renderSubs();
  const L = state.tasks, open = L.filter(t => t.st !== 'เสร็จ'), done = L.filter(t => t.st === 'เสร็จ');
  const over = open.filter(t => t.days !== null && t.days < 0).length;
  let h = '<div class="sum"><span class="pill">ค้าง <b>' + open.length + '</b></span>' + (over ? '<span class="pill">เลยกำหนด <b style="color:var(--bad)">' + over + '</b></span>' : '') +
    '<span class="pill">เสร็จ 30 วัน <b>' + done.length + '</b></span></div>';
  if (!L.length) h += '<div class="empty">' + (state.scope === 'mine' ? 'ยังไม่มีงานที่มอบให้คุณ' : 'ยังไม่มีงานในมุมมองนี้') + '</div>';
  h += open.map(taskCard).join('');
  if (done.length) h += '<h2>เสร็จแล้ว (30 วันล่าสุด)</h2>' + done.map(taskCard).join('');
  $('main').innerHTML = h;
  $('main').querySelectorAll('button[data-act]').forEach(b => b.onclick = () => onAct(b));
}
function renderSubs() {
  const S = state.subs;
  let h = S.length ? '' : '<div class="empty">ยังไม่มีเรื่องที่คุณส่งเสนอลงนาม</div>';
  h += S.map(s => '<div class="card"><p class="subj">' + esc(s.icon) + ' ' + esc(s.subj) + '</p>' +
    '<div class="meta">เลขรับ #' + esc(s.no) + ' · ' + esc(s.at) + '</div><div class="row"><span class="chip' +
    (s.st === 'ลงนามแล้ว' ? ' ok' : /ส่งกลับ|ไม่ครบ|ไม่สำเร็จ/.test(s.st) ? ' warn' : '') + '">' + esc(s.st) + '</span></div>' +
    (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') + '</div>').join('');
  $('main').innerHTML = h;
}
async function onAct(b) {
  const card = b.closest('.card'), key = card.dataset.key, act = b.dataset.act, box = card.querySelector('.post');
  if (act === 'post') { box.classList.add('show'); return; }
  if (act === 'cancel') { box.classList.remove('show'); return; }
  const body = { api: 'act', key: key, action: act };
  if (act === 'postpone') { body.to = card.querySelector('.pdate').value; body.why = card.querySelector('.pwhy').value.trim();
    if (!body.to) return toast('เลือกวันที่ก่อน'); if (!body.why) return toast('ใส่เหตุผลก่อน'); }
  if (act === 'done' && !confirm('ยืนยันว่างานนี้เสร็จแล้ว?')) return;
  card.querySelectorAll('button').forEach(x => x.disabled = true);
  try {
    await api(body);
    toast(act === 'ack' ? 'รับทราบแล้ว' : act === 'done' ? 'บันทึกว่าเสร็จแล้ว' : 'ส่งคำขอเลื่อนแล้ว');
    await load();
  } catch (e) { const m = ERR[e && e.err] || ERR.server; toast(m[0] + (m[1] ? ' — ' + m[1] : '')); card.querySelectorAll('button').forEach(x => x.disabled = false); }
}

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  load();
}).catch(e => { $('who').textContent = ''; $('main').innerHTML = '<div class="msg"><h3>เปิดหน้าไม่สำเร็จ</h3>เปิดจากลิงก์ในแชท LINE (' + esc(e && e.message || e) + ')</div>'; });
</script>
</body>
</html>
